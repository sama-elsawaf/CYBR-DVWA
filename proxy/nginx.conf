# R1: TLS-terminating reverse proxy in front of DVWA. Only this container publishes ports.

# Plain HTTP: no content, only a permanent redirect to HTTPS.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;   # ECDSA P-256, issued by the local lab CA
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols TLSv1.3;                              # TLS 1.3 only (1.0-1.2 refused)
    ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256;
    ssl_ecdh_curve X25519;                              # key exchange group
    ssl_prefer_server_ciphers off;                      # let the client pick among the three AEAD suites
    ssl_session_tickets off;
    server_tokens off;

    # HSTS: browsers must use HTTPS for this host for one year (browsers ignore HSTS on bare IPs; use https://localhost)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://dvwa:80;                      # internal Docker network only
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
