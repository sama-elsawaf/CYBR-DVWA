volumes:
  dvwa:


networks:
  dvwa:


# R7 / D2: secrets live in files under ./secrets (gitignored), never in this file or in the
# container environment. Create them once with scripts/gen_secrets.sh (or gen_secrets.ps1).
# Compose mounts each one read-only at /run/secrets/<name> inside the container.
secrets:
  crypto_master_key:
    file: ./secrets/crypto_master_key.txt
  db_password:
    file: ./secrets/db_password.txt
  db_root_password:
    file: ./secrets/db_root_password.txt


services:
  dvwa:
    build: .
    image: ghcr.io/digininja/dvwa:latest
    # Change `always` to `build` to build from local source
    pull_policy: always
    environment:
      - DB_SERVER=db
      # Only the PATHS of the secrets are in the environment, not the values.
      - CRYPTO_KEY_FILE=/run/secrets/crypto_master_key
      - DB_PASSWORD_FILE=/run/secrets/db_password
      # Clients only reach DVWA through the TLS proxy, so cookies always get the Secure flag.
      - FORCE_SECURE_COOKIES=1
    secrets:
      - crypto_master_key
      - db_password
    depends_on:
      - db
    volumes:
      - ./:/var/www/html
      # Always use the committed, secret-free config (no stale local copy with old defaults).
      - ./config/config.inc.php.dist:/var/www/html/config/config.inc.php:ro
    networks:
      - dvwa
    # R1: no published port. DVWA is only reachable through the TLS proxy below.
    expose:
      - "80"
    restart: unless-stopped

  # R1: TLS 1.3 reverse proxy (nginx). Create the certificates first: sh scripts/gen_lab_certs.sh
  proxy:
    image: docker.io/library/nginx:1.28-alpine
    depends_on:
      - dvwa
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/server.crt:/etc/nginx/certs/server.crt:ro
      - ./certs/server.key:/etc/nginx/certs/server.key:ro
    networks:
      - dvwa
    ports:
      - 127.0.0.1:443:443
      - 127.0.0.1:80:80
    restart: unless-stopped

  db:
    image: docker.io/library/mariadb:10
    environment:
      - MARIADB_ROOT_PASSWORD_FILE=/run/secrets/db_root_password
      - MARIADB_DATABASE=dvwa
      - MARIADB_USER=dvwa
      - MARIADB_PASSWORD_FILE=/run/secrets/db_password
    secrets:
      - db_root_password
      - db_password
    volumes:
      - dvwa:/var/lib/mysql
    networks:
      - dvwa
    restart: unless-stopped
